services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: motionfield
      POSTGRES_PASSWORD: motionfield
      POSTGRES_DB: motionfield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motionfield -d motionfield"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
